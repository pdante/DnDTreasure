apply plugin: 'com.android.application'

def localPropsFile = rootProject.file('local.properties')
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def keystoreProp = { String name ->
    localProps.getProperty(name) ?: System.getenv(name)
}

android {
    signingConfigs {
        config {
            def storePath = keystoreProp('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword keystoreProp('RELEASE_STORE_PASSWORD')
                keyAlias keystoreProp('RELEASE_KEY_ALIAS')
                keyPassword keystoreProp('RELEASE_KEY_PASSWORD')
            }
        }
    }
    compileSdkVersion 23
    defaultConfig {
        applicationId "com.dante.paul.lootgeneratorfordnd5epremium"
        minSdkVersion 16
        targetSdkVersion 23
        versionCode 2
        versionName "1.2"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProp('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.config
            }
        }
        debug {
            debuggable true
            zipAlignEnabled true
        }
    }
    productFlavors {
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    testCompile 'junit:junit:4.12'
    compile 'com.android.support:appcompat-v7:23.1.1'
    compile 'com.android.support:design:23.1.1'
    compile 'com.google.android.gms:play-services-ads:8.3.0'
}
