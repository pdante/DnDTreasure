plugins {
    id 'com.android.application'
}

def localPropsFile = rootProject.file('local.properties')
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def keystoreProp = { String name ->
    localProps.getProperty(name) ?: System.getenv(name)
}

android {
    namespace 'com.verdantsoftware.lootforge'
    compileSdk 36

    defaultConfig {
        applicationId "com.verdantsoftware.lootforge"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        config {
            def storePath = keystoreProp('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword keystoreProp('RELEASE_STORE_PASSWORD')
                keyAlias keystoreProp('RELEASE_KEY_ALIAS')
                keyPassword keystoreProp('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProp('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.config
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'com.android.billingclient:billing:7.1.1'

    testImplementation 'junit:junit:4.13.2'
}
